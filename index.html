<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10142a" />
  <title>Protocolo de Seleção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell" aria-live="polite">
    <section id="loginView" class="view login-view active">
      <div class="login-hero">
        <p class="eyebrow centered">PROTOCOLO DE IDENTIFICAÇÃO</p>
        <h1 class="centered">ACESSO RESTRITO</h1>
      </div>

      <form id="accessForm" class="panel form-panel">
        <label for="reference" class="field-label">Informe a referência</label>
        <input id="reference" name="reference" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="IGNIS" maxlength="10" required />
        <p class="field-help">Sistema interno de identificação</p>
        <button type="submit" class="primary-btn">Confirmar acesso <span aria-hidden="true">→</span></button>
      </form>

      <p id="loginMessage" class="feedback" role="status"></p>

      <div class="footer-note">
        <span>USO INTERNO</span>
        <span>DESDE 1976</span>
      </div>
    </section>

    <section id="dashboardView" class="view">
      <div class="hero compact-hero">
        <h1>PROTOCOLO</h1>
        <p class="hero-ref">Referência <span id="unitTitle">Ignis</span></p>
        <div class="hero-divider"></div>
        <p class="status-line">Status: <strong id="processStatus">em aberto</strong></p>
      </div>

      <section class="panel stages-panel">
        <div class="panel-head">
          <h2>ESTÁGIOS</h2>
          <span class="panel-counter" id="progressText">1/7</span>
        </div>
        <div id="stageList" class="stage-list"></div>
      </section>

      <blockquote class="quote">“Nem todos os olhos veem o mesmo.”</blockquote>
      <p class="access-copy">ACESSO RESTRITO</p>
      <button id="logoutBtn" class="ghost-btn">Encerrar acesso</button>
    </section>

    <section id="stageView" class="view">
      <button id="backBtn" class="back-link" type="button">← Voltar aos estágios</button>

      <div class="hero compact-hero stage-hero">
        <p class="eyebrow" id="stageCode">ETAPA 02</p>
        <h1 id="stageName">Aptidão</h1>
        <div class="hero-divider"></div>
        <p class="status-line"><strong id="stageStatus">disponível</strong></p>
      </div>

      <section class="panel detail-panel">
        <div class="panel-head">
          <h2>INSTRUÇÃO</h2>
          <span class="panel-counter">ATIVA</span>
        </div>
        <div id="stageContext" class="context-copy"></div>
        <div id="stageMission" class="mission-copy"></div>
        <div id="stageActions" class="stage-actions"></div>
      </section>

      <p class="access-copy stage-foot">ACESSO RESTRITO</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
